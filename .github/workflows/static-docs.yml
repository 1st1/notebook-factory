name: Static project docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check out unreleased Lat UI
        uses: actions/checkout@v4
        with:
          repository: vercel-labs/lat.md
          ref: main
          path: .lat-build/toolchain
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Build app and static docs
        run: npm run build --prefix frontend
        env:
          LAT_SOURCE_DIR: ${{ github.workspace }}/.lat-build/toolchain
      - name: Validate static routes
        run: node scripts/check_lat_ui.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: lat-static
          path: frontend/dist/lat
          if-no-files-found: error
